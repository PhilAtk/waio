user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 4096;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    include /etc/nginx/conf.d/*.conf;

	server {	
		listen 443 ssl;
		server_name waio.dev;

		ssl_certificate /etc/letsencrypt/live/waio.dev/fullchain.pem;
		ssl_certificate_key /etc/letsencrypt/live/waio.dev/privkey.pem;
    		include /etc/letsencrypt/options-ssl-nginx.conf; 
    		ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

		location / {
			proxy_pass http://waio-dev:80;
			proxy_set_header Host $host;
			proxy_set_header X-Forwarded-Proto https;
		}
	}

    	server {	
        	listen 80;
        	server_name  waio.dev;

		location /.well-known/acme-challenge/ {
			root /var/www/certbot;
		}

		location / {
			return 301 https://$host$request_uri;
		}
	}

	server {
		listen 443 ssl;
		server_name rhythmology.study;

		ssl_certificate /etc/letsencrypt/live/rhythmology.study/fullchain.pem;
		ssl_certificate_key /etc/letsencrypt/live/rhythmology.study/privkey.pem;
    		include /etc/letsencrypt/options-ssl-nginx.conf; 
    		ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

		location / {
			proxy_pass http://rhythmology:80;
			proxy_set_header Host $host;
			proxy_set_header X-Forwarded-Proto https;
		}
	}

	server {
		listen 80;
		server_name rhythmology.study;

		location /.well-known/acme-challenge/ {
			root /var/www/certbot;
		}
		
		location / {
			return 301 https://$host$request_uri;
		}
	}
}

